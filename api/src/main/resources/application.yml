spring:
  application:
    name: order-system
  jpa:
    properties:
      hibernate:
        query.in_clause_parameter_padding: true
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
    out-of-order: true
  profiles:
    default: local
    active: local
  security:
    jwt:
      issuer: order-system
      access-token-expiration-seconds: 3600
      refresh-token-expiration-seconds: 1209600
      secret: ${ORDER_SYSTEM_JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
      auth-code-expiration-millis: 1800000
  kafka:
    producer:
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: manual_immediate

cors:
  allowed:
    origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app:
  kafka:
    topics:
      order-created: ${KAFKA_TOPIC_ORDER_CREATED:order.created.v1}
      order-result: ${KAFKA_TOPIC_ORDER_RESULT:order.result.v1}
      email-send-requested: ${KAFKA_TOPIC_EMAIL_SEND_REQUESTED:email.send.requested.v1}
    consumers:
      order-created:
        group-id: ${KAFKA_GROUP_ID_ORDER_CREATED:order-created-consumer-v1}
        concurrency: ${KAFKA_CONCURRENCY_ORDER_CREATED:1}
      notification-order-result:
        group-id: ${KAFKA_GROUP_ID_NOTIFICATION_ORDER_RESULT:notification-order-result-consumer-v1}
        concurrency: ${KAFKA_CONCURRENCY_NOTIFICATION_ORDER_RESULT:1}
      email-send-requested:
        group-id: ${KAFKA_GROUP_ID_EMAIL_SEND_REQUESTED:email-send-requested-consumer-v1}
        concurrency: ${KAFKA_CONCURRENCY_EMAIL_SEND_REQUESTED:1}
      dlt:
        group-id: ${KAFKA_GROUP_ID_DLT:order-dlt-consumer-v1}
    error-handler:
      retry-attempts: ${KAFKA_CONSUMER_RETRY_ATTEMPTS:3}
      retry-backoff-millis: ${KAFKA_CONSUMER_RETRY_BACKOFF_MILLIS:1000}
      dlt-suffix: ${KAFKA_DLT_SUFFIX:.dlt}
      dlt-partition: ${KAFKA_DLT_PARTITION:0}

outbox:
  relay:
    enabled: ${OUTBOX_RELAY_ENABLED:true}
    batch-size: ${OUTBOX_RELAY_BATCH_SIZE:50}
    fixed-delay-millis: ${OUTBOX_RELAY_FIXED_DELAY_MILLIS:500}
    retry-backoff-millis: ${OUTBOX_RELAY_RETRY_BACKOFF_MILLIS:5000}
    max-retry-count: ${OUTBOX_RELAY_MAX_RETRY_COUNT:5}

redis:
  cache:
    default-ttl-seconds: ${REDIS_CACHE_DEFAULT_TTL_SECONDS:3600}
    ttl-seconds:
      stock: ${REDIS_CACHE_STOCK_TTL_SECONDS:3600}

server:
  host-url: ${SERVER_HOST_URL:http://localhost:8080}
